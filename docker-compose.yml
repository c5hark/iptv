services:
  iptv:
    build: .
    ports:
      - "8080:8080"
    environment:
      IPTV_STREAM_BASE_URL: "http://stream.example.com"
    volumes:
      - iptv-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  iptv-data: